# Deploy: fly launch --no-deploy  (first time)
#         fly deploy               (subsequent deploys)
# Domain:  fly certs add api.getvonix.com

app     = "vonix-api"
primary_region = "lhr"  # London — close to Vonix users

[build]
  dockerfile = "Dockerfile"

[env]
  ENV      = "production"
  PORT     = "8080"
  # Set via: fly secrets set CORS_ORIGINS="https://app.getvonix.com"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  memory    = "256mb"
  cpu_kind  = "shared"
  cpus      = 1

[checks]
  [checks.health]
    grace_period = "5s"
    interval     = "15s"
    method       = "GET"
    path         = "/health"
    port         = 8080
    timeout      = "5s"
    type         = "http"
